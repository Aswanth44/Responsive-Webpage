<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Response Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>💬 Let's Connect</h1>
    <p class="subtitle">We love smart responses ✨</p>

    <div class="progress-bar">
        <div class="progress"></div>
    </div>

    <form id="responseForm">
        <div class="input-box">
            <input type="text" required id="name">
            <label>Name</label>
        </div>

        <div class="input-box">
            <input type="email" required id="email">
            <label>Email</label>
        </div>

        <div class="input-box">
            <textarea required id="message"></textarea>
            <label>Your Message</label>
        </div>

        <button type="submit">Submit 🚀</button>
    </form>

    <div class="reaction">
        <img src="assets/thinking.gif" id="reactionGif">
        <p id="reactionText">Waiting for your response...</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
